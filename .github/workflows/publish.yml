name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Close and release the staging repository after publishing"
        type: boolean
        default: true
  push:
    branches: [ main ]
    # Only run snapshot publishing when version ends with -SNAPSHOT
    paths-ignore:
      - '**.md'
      - 'ascii/**'
    tags:
      - 'v*'

jobs:
  # Create a shared staging repository on Sonatype S01 for releases
  create-staging-repository:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    runs-on: ubuntu-latest
    outputs:
      repository_id: ${{ steps.staging.outputs.repository_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - id: staging
        name: Create Sonatype staging repository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x gradlew
          REPO_ID=$(./gradlew -q createStagingRepository)
          echo "repository_id=${REPO_ID}" >> $GITHUB_OUTPUT

  # Build and publish from each OS into the same staging repository
  publish:
    needs: [ create-staging-repository ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish variants to shared staging repository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralRepositoryId: ${{ needs.create-staging-repository.outputs.repository_id }}
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace publishToMavenCentral

  close-and-release:
    needs: [ publish ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Close and release staging repository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralRepositoryId: ${{ needs.create-staging-repository.outputs.repository_id }}
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace closeAndReleaseSonatypeStagingRepository

  # Snapshot publishing from Linux only (S01 snapshots). Triggered on push to main with -SNAPSHOT version.
  publish-snapshot:
    if: (!startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish SNAPSHOT
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace publishAllPublicationsToMavenCentral
